<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cue Sheet 台灣電影音樂活動</title>
<meta name="description" content="Cue Sheet 整理的全台電影、動畫與遊戲音樂音樂會與講座，可依地區、城市篩選，並加入行事曆。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0EA; --paper:#FBFAF6; --ink:#28251D; --muted:#7A7974; --soft:#55534C;
  --line:#D4D1CA; --teal:#01696F; --teal-bg:#EEF4F3; --chip:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1A16; --paper:#24221D; --ink:#EDEBE4; --muted:#A3A19A; --soft:#C9C6BE;
    --line:#3B3932; --teal:#4FB3B8; --teal-bg:#1E3233; --chip:#2C2A24;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1A16; --paper:#24221D; --ink:#EDEBE4; --muted:#A3A19A; --soft:#C9C6BE;
  --line:#3B3932; --teal:#4FB3B8; --teal-bg:#1E3233; --chip:#2C2A24;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
a{color:var(--teal)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header.mast{background:var(--paper);border-bottom:5px solid var(--ink)}
header.mast .wrap{padding-top:22px;padding-bottom:14px}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.title{font-family:Georgia,"Noto Serif TC",serif;font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:6px 0 0}
.sub{font-size:15px;color:var(--soft);margin:10px 0 0}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.filters .wrap{padding-top:12px;padding-bottom:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .lab{font-size:12px;color:var(--muted);min-width:2.6em}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
select{font:inherit;font-size:14px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--chip);color:var(--ink);min-height:34px;max-width:100%}
.count{font-size:13px;color:var(--muted)}
main .wrap{padding-top:8px;padding-bottom:40px}
.month{font-family:Georgia,"Noto Serif TC",serif;font-size:22px;font-weight:700;margin:26px 0 4px;padding-top:8px;border-top:1px solid var(--ink)}
.item{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:14px 0;border-top:1px dotted var(--line)}
.month + .item{border-top:none}
.date{font-weight:700;font-size:20px;line-height:1.1}
.date small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.name{font-weight:700;font-size:16px;line-height:1.45;margin:0;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--soft);margin-top:3px;overflow-wrap:anywhere}
.tag{display:inline-block;border:1px solid var(--teal);color:var(--teal);font-size:11px;padding:0 6px;margin-right:6px;line-height:1.6;vertical-align:1px}
.note{display:inline-block;font-size:12px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13px}
.acts a,.acts button{color:var(--teal);background:none;border:none;padding:0;font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{border-top:3px double var(--ink);margin-top:10px;padding:12px 0 30px;font-size:12px;color:var(--muted)}
@media (max-width:540px){.title{font-size:34px}.item{grid-template-columns:64px 1fr}.date{font-size:18px}}
</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <div class="kicker">Cue Sheet · Upcoming in Taiwan</div>
  <h1 class="title">Cue Sheet</h1>
  <p class="sub">全台電影、動畫與遊戲音樂的音樂會與講座。選你所在的地區或城市，挑好場次直接加入行事曆。</p>
</div></header>

<nav class="filters" aria-label="篩選"><div class="wrap">
  <div class="row" id="regions" role="group" aria-label="地區"><span class="lab">地區</span></div>
  <div class="row">
    <span class="lab">城市</span>
    <select id="city" aria-label="城市"><option value="">全部城市</option></select>
    <span class="lab" style="margin-left:6px">類型</span>
    <select id="kind" aria-label="類型"><option value="">全部</option><option>音樂會</option><option>講座</option><option>影展活動</option></select>
    <span class="count" id="count"></span>
  </div>
</div></nav>

<main><div class="wrap" id="list"><div class="empty">載入中…</div></div></main>

<footer><div class="wrap">
  <div>活動資料來源：文化部藝文活動開放資料（政府資料開放授權條款）、各主辦單位公告與新聞報導；場次以主辦單位公告為準。標示「依新聞」者尚未經主辦單位官方頁確認。</div>
  <div id="updated" style="margin-top:4px"></div>
</div></footer>

<script>
const REGIONS = [
  ["北部", ["臺北市","新北市","基隆市","桃園市","新竹市","新竹縣","宜蘭縣"]],
  ["中部", ["苗栗縣","臺中市","彰化縣","南投縣","雲林縣"]],
  ["南部", ["嘉義市","嘉義縣","臺南市","高雄市","屏東縣"]],
  ["東部與離島", ["花蓮縣","臺東縣","澎湖縣","金門縣","連江縣"]],
];
const WEEK = "日一二三四五六";
const state = { region: "", city: "", kind: "" };

function regionOf(city){ for (const [r, cs] of REGIONS) if (cs.includes(city)) return r; return ""; }
function parseTime(s){
  const m = (s||"").trim().match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/);
  if (!m) return null;
  return { y:+m[1], mo:+m[2], d:+m[3], h: m[4]!=null ? +m[4] : null, mi: m[5]!=null ? +m[5] : 0 };
}
function kindOf(ev){
  const t = (ev.title||"") + (ev.category||"");
  if (t.includes("講座") || t.includes("大師課") || ev.category === "講座") return "講座";
  if (t.includes("影展")) return "影展活動";
  return "音樂會";
}
function normVenue(v){ return (v||"").replace(/臺/g,"台").replace(/\s/g,"").replace("國家音樂廳","音樂廳"); }
function pad(n){ return String(n).padStart(2,"0"); }
function dayKey(t){ return `${t.y}${pad(t.mo)}${pad(t.d)}`; }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// 台北時間轉 UTC 字串（行事曆用）
function utcStamp(t, addMin){
  const ms = Date.UTC(t.y, t.mo-1, t.d, (t.h ?? 0) - 8, t.mi) + (addMin||0)*60000;
  const d = new Date(ms);
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
}
function nextDay(t){
  const d = new Date(Date.UTC(t.y, t.mo-1, t.d+1));
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}`;
}
function calRange(show){
  const t = show._t;
  if (show.time_tbd || t.h == null) return { allDay:true, start: dayKey(t), end: nextDay(t) };
  const e = parseTime(show.end_time);
  const mins = e && e.h != null ? ((Date.UTC(e.y,e.mo-1,e.d,e.h,e.mi) - Date.UTC(t.y,t.mo-1,t.d,t.h,t.mi))/60000) : 120;
  return { allDay:false, start: utcStamp(t), end: utcStamp(t, mins > 0 ? mins : 120) };
}
function googleLink(ev, show){
  const r = calRange(show);
  const p = new URLSearchParams({
    action: "TEMPLATE", text: ev.title,
    dates: `${r.start}/${r.end}`,
    location: [show.venue, show.address].filter(Boolean).join(" "),
    details: [ev.tickets || ev.web || "", "（Cue Sheet 台灣電影音樂活動）"].join("\n"),
    ctz: "Asia/Taipei",
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
function icsText(ev, show){
  const r = calRange(show);
  const clean = s => String(s||"").replace(/[\\,;]/g, m => "\\"+m).replace(/\n/g,"\\n");
  const dt = r.allDay ? [`DTSTART;VALUE=DATE:${r.start}`, `DTEND;VALUE=DATE:${r.end}`] : [`DTSTART:${r.start}`, `DTEND:${r.end}`];
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cue Sheet//Taiwan Events//ZH","BEGIN:VEVENT",
    `UID:${(ev.uid||"cs")}-${r.start}@cuesheet`, `DTSTAMP:${utcStamp({y:2026,mo:1,d:1,h:8,mi:0})}`,
    ...dt, `SUMMARY:${clean(ev.title)}`,
    `LOCATION:${clean([show.venue, show.address].filter(Boolean).join(" "))}`,
    `DESCRIPTION:${clean(ev.tickets || ev.web || "")}`,
    (ev.tickets || ev.web) ? `URL:${ev.tickets || ev.web}` : "",
    "END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
}
function downloadIcs(ev, show){
  const blob = new Blob([icsText(ev, show)], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${ev.title.replace(/[\\/:*?"<>|]/g,"")}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

let SHOWS = [];

async function load(){
  const bust = "?t=" + new Date().toISOString().slice(0,13);
  const get = url => fetch(url + bust).then(r => r.ok ? r.json() : null).catch(() => null);
  const [main, manual] = await Promise.all([get("events.json"), get("manual_events.json")]);
  const events = (main && main.events) || [];
  const have = new Set();
  const today = new Date(); const todayKey = `${today.getFullYear()}${pad(today.getMonth()+1)}${pad(today.getDate())}`;
  const push = (ev, s) => {
    const t = parseTime(s.time); if (!t) return;
    if (dayKey(t) < todayKey) return;            // 已結束的場次不列
    const city = s.city || ""; const region = regionOf(city); if (!region) return;
    SHOWS.push({ ev, show: Object.assign({}, s, { _t: t }), city, region, kind: kindOf(ev) });
  };
  for (const ev of events) for (const s of (ev.shows||[])) {
    const t = parseTime(s.time); if (t) have.add(dayKey(t) + "|" + normVenue(s.venue));
    push(ev, s);
  }
  for (const ev of ((manual && manual.events) || [])) for (const s of (ev.shows||[])) {
    const t = parseTime(s.time); if (!t) continue;
    if (have.has(dayKey(t) + "|" + normVenue(s.venue))) continue;  // 同日同場館不重複
    push(ev, s);
  }
  SHOWS.sort((a,b) => (dayKey(a.show._t) + pad(a.show._t.h ?? 99) + pad(a.show._t.mi)).localeCompare(dayKey(b.show._t) + pad(b.show._t.h ?? 99) + pad(b.show._t.mi)));
  if (main && main.updated) document.getElementById("updated").textContent = "資料更新：" + main.updated.replace("T"," ").slice(0,16) + "（每日自動更新）";
  readUrl(); buildControls(); render();
}

function buildControls(){
  const box = document.getElementById("regions");
  [["", "全部"], ...REGIONS.map(([r]) => [r, r])].forEach(([val, label]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label; b.dataset.val = val;
    b.setAttribute("aria-pressed", String(state.region === val));
    b.onclick = () => { state.region = val; state.city = ""; syncControls(); render(); };
    box.appendChild(b);
  });
  document.getElementById("city").onchange = e => { state.city = e.target.value; if (state.city) state.region = regionOf(state.city); syncControls(); render(); };
  document.getElementById("kind").onchange = e => { state.kind = e.target.value; render(); };
  syncControls();
}
function syncControls(){
  document.querySelectorAll("#regions .chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === state.region)));
  const sel = document.getElementById("city");
  const cities = [...new Set(SHOWS.filter(x => !state.region || x.region === state.region).map(x => x.city))];
  const order = REGIONS.flatMap(([,cs]) => cs);
  cities.sort((a,b) => order.indexOf(a) - order.indexOf(b));
  sel.innerHTML = `<option value="">${state.region ? "全部" + state.region + "城市" : "全部城市"}</option>` +
    cities.map(c => `<option ${c===state.city?"selected":""}>${c}</option>`).join("");
  document.getElementById("kind").value = state.kind;
}
function readUrl(){
  const q = new URLSearchParams(location.search);
  if (q.get("region") && REGIONS.some(([r]) => r === q.get("region"))) state.region = q.get("region");
  if (q.get("city")) { state.city = q.get("city"); state.region = regionOf(state.city) || state.region; }
  if (q.get("kind")) state.kind = q.get("kind");
}
function writeUrl(){
  const q = new URLSearchParams();
  if (state.region) q.set("region", state.region);
  if (state.city) q.set("city", state.city);
  if (state.kind) q.set("kind", state.kind);
  history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : ""));
}

function render(){
  writeUrl();
  const rows = SHOWS.filter(x =>
    (!state.region || x.region === state.region) &&
    (!state.city || x.city === state.city) &&
    (!state.kind || x.kind === state.kind));
  document.getElementById("count").textContent = `共 ${rows.length} 場`;
  const list = document.getElementById("list");
  if (!rows.length) { list.innerHTML = `<div class="empty">這個條件下目前沒有場次。</div>`; return; }
  let html = "", month = "";
  rows.forEach((x, i) => {
    const t = x.show._t, m = `${t.y} 年 ${t.mo} 月`;
    if (m !== month) { html += `<h2 class="month">${m}</h2>`; month = m; }
    const wd = WEEK[new Date(t.y, t.mo-1, t.d).getDay()];
    const time = (x.show.time_tbd || t.h == null) ? "時間未公布" : `${pad(t.h)}:${pad(t.mi)}`;
    const org = Array.isArray(x.ev.organizer) ? x.ev.organizer.filter(Boolean).join("、") : (x.ev.organizer || "");
    const who = org ? `主辦：${esc(org)}` : (x.ev.performer ? `演出：${esc(x.ev.performer)}` : "");
    const link = x.ev.tickets || x.ev.web;
    html += `<article class="item">
      <div class="date">${t.mo}/${t.d}<small>（${wd}）${time}</small></div>
      <div>
        <h3 class="name">${esc(x.ev.title)}</h3>
        <div class="meta"><span class="tag">${x.kind}</span>${esc(x.city.slice(0,2))}・${esc(x.show.venue || "場地未標示")}${who ? " · " + who : ""}</div>
        ${x.ev.note ? `<div class="note">${esc(x.ev.note)}</div>` : ""}
        <div class="acts">
          ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">購票／詳情</a>` : ""}
          <a href="${esc(googleLink(x.ev, x.show))}" target="_blank" rel="noopener">加入 Google 日曆</a>
          <button type="button" data-i="${i}">下載行事曆檔（Apple／Outlook）</button>
        </div>
      </div></article>`;
  });
  list.innerHTML = html;
  list.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => { const x = rows[+b.dataset.i]; downloadIcs(x.ev, x.show); });
}

load();
</script>
</body>
</html>
