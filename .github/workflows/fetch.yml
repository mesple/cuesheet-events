name: 每日抓取藝文活動

on:
  schedule:
    - cron: "17 18 * * *"   # 每天臺灣時間 02:17
  workflow_dispatch:         # 允許在 Actions 頁面手動執行

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取並篩選
        run: python fetch_events.py
      - name: 有變動才存檔
        if: always()
        run: |
          git config user.name "cuesheet-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in events.json last_run.json all_events_index.json candidates.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "更新活動資料 $(date -u +%F)"
          git push
